<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple Music 歌词回响</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #252628;
      color: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      background: #252628;
    }

    .poster {
      position: relative;
      width: 100%;
      max-width: 375px;
      margin: 0 auto;
      height: auto;
      background-color: #252628;
      overflow: hidden;
      padding: 16px 0 48px 0;
    }

    .bg-blur-container {
      position: absolute;
      top: -40px;
      left: -40px;
      right: -40px;
      bottom: -40px;
      z-index: 0;
      overflow: hidden;
    }

    .bg-blur {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(40px) brightness(0.55) saturate(140%);
      transform: scale(1.1);
    }

    .pull-bar {
      position: relative;
      z-index: 2;
      width: 36px;
      height: 5px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 3px;
      margin: 0 auto 28px auto;
    }

    .player-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding: 0 28px;
      margin-bottom: 40px;
    }
    .cover-art-wrap {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      background: #3a3a3c;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .meta-info {
      flex: 1;
      margin-left: 14px;
      min-width: 0;
    }
    .track-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .track-artist {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 12px;
    }
    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .action-btn.fav {
      background: rgba(255, 255, 255, 0.16);
    }
    .action-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .lyrics-body {
      position: relative;
      z-index: 2;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .lyric-line {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.38;
      letter-spacing: -0.5px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .lyric-line.highlight {
      color: #ffffff;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.05);
    }
    .lyric-line.comment {
      color: rgba(255, 255, 255, 0.32);
      font-weight: 700;
      margin-top: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="bg-blur-container">
      <img class="bg-blur" src="{{coverUrl}}" alt="" onerror="this.style.display='none'">
    </div>
    <div class="pull-bar"></div>
    <div class="player-header">
      <div class="cover-art-wrap">
        <img class="cover-img" src="{{coverUrl}}" alt="" onerror="this.style.display='none'">
      </div>
      <div class="meta-info">
        <div class="track-title">{{bookName}}</div>
        <div class="track-artist">{{author}}</div>
      </div>
      <div class="header-actions">
        <div class="action-btn fav">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>
        </div>
        <div class="action-btn">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
        </div>
      </div>
    </div>
    <div class="lyrics-body" id="lyricsBody"></div>
  </div>

  <div id="rawAnnotation" style="display:none">{{latestAnnotation}}</div>
  <div id="rawNote" style="display:none">{{latestAnnotationNote}}</div>

  <script>
    (function() {
      var rawAnno = document.getElementById('rawAnnotation').textContent.trim();
      var rawNote = document.getElementById('rawNote').textContent.trim();
      var lyricsBody = document.getElementById('lyricsBody');

      if (rawAnno) {
        var lines = rawAnno.includes('\n')
          ? rawAnno.split(/\n+/).map(function(s) { return s.trim(); }).filter(Boolean)
          : (rawAnno.match(/[^。！？\?;]+[。！？\?;]?/g) || [rawAnno]);

        lines.forEach(function(lineStr) {
          var lineEl = document.createElement('div');
          lineEl.className = 'lyric-line highlight';
          lineEl.textContent = lineStr.trim();
          lyricsBody.appendChild(lineEl);
        });
      }

      if (rawNote) {
        var commentEl = document.createElement('div');
        commentEl.className = 'lyric-line comment';
        commentEl.textContent = rawNote;
        lyricsBody.appendChild(commentEl);
      }
    })();
  </script>
</body>
</html>
